name: Deploy Cloudflare and connect game
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - project/wrangler.jsonc
      - project/worker/**
      - project/src/engine.ts
      - project/src/protocol.ts
      - project/src/catalog.ts
      - project/src/categories.json
      - project/src/data.json
      - project/migrations/**
      - project/scripts/deploy.mjs
permissions:
  contents: write
  pages: write
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: project/package-lock.json
      - name: Check Cloudflare credential
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
      - run: npm ci
      - run: npm run check && npm test
      - name: Deploy API and migrate D1
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      - name: Publish live service configuration
        working-directory: .
        run: |
          node -e "const fs=require('node:fs');const data=JSON.parse(fs.readFileSync('project/deployment-result.json','utf8'));fs.writeFileSync('config.json',JSON.stringify(data,null,2)+'\n');"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.json project/public/config.json
          if ! git diff --cached --quiet; then
            git commit -m 'Connect game to deployed Cloudflare service'
            git push
          fi
      - name: Rebuild published Pages configuration
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
